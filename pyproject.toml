[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netops-toolkit"
version = "0.1.0"
description = "跨平台网络工程师工具箱与网络监控告警平台"
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.6",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "jinja2>=3.1",
  "httpx>=0.27",
  "keyring>=24.0",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'"]
snmp  = ["pysnmp>=6.0"]
dev   = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
netops = "netops.__main__:main"
netmon = "netops.netmon.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netops"]

[tool.hatch.build.targets.wheel.force-include]
"src/netops/core/migrations" = "netops/core/migrations"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]